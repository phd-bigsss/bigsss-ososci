<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Selective reporting</title>
  <desc id="desc">Illustration card for selective reporting bad practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="628" rx="28" fill="none" stroke="#495057" stroke-width="8"/>
  <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#212529">Selective Reporting</text>
  <text x="600" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#495057">Only favorable outcomes are reported</text>
  <g transform="translate(160,360)">
    <rect x="0" y="0" width="880" height="210" rx="18" fill="#ffffff" stroke="#adb5bd" stroke-width="4"/>
    <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#2f3e46">Reported: Outcome A (p = 0.03) ✓</text>
    <text x="40" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#6c757d">Omitted: Outcome B (p = 0.41)</text>
    <text x="40" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#6c757d">Omitted: Robustness check (null)</text>
  </g>
</svg>
