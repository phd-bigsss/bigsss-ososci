<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">HARKing</title>
  <desc id="desc">Illustration card for HARKing bad practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#ffe8cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="628" rx="28" fill="none" stroke="#f08c00" stroke-width="8"/>
  <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" fill="#ad6800">HARKing</text>
  <text x="600" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#7a4d00">Hypothesizing After Results are Known</text>
  <g transform="translate(170,360)">
    <rect x="0" y="0" width="390" height="210" rx="18" fill="#ffffff" stroke="#ffd08a" stroke-width="4"/>
    <text x="30" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#4f3f2f">Step 1: Analyze data</text>
    <text x="30" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#5f4b32">Unexpected pattern found</text>
    <text x="30" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#5f4b32">No prior hypothesis</text>
  </g>
  <g transform="translate(640,360)">
    <rect x="0" y="0" width="390" height="210" rx="18" fill="#ffffff" stroke="#ffd08a" stroke-width="4"/>
    <text x="30" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#4f3f2f">Step 2: Rewrite story</text>
    <text x="30" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#5f4b32">"This was expected"</text>
    <text x="30" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#d9480f">Post-hoc as pre-registered</text>
  </g>
</svg>
